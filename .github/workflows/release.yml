name: release

# Cut a release by pushing a tag that matches the packaged version:
#
#     # bump __version__ in src/tenstorrent/__init__.py, commit, then:
#     git tag v0.1.0 && git push origin v0.1.0
#
# The tag drives everything and nothing here rewrites the repo — no bot commits, no
# temp branches. A tag that points at a commit outside main, or that disagrees with
# `__version__`, fails in the first job, before anything is built or published. The
# one exception is a beta (`X.Y.ZbN`), which may also be tagged on a `beta/<feature>`
# branch; see docs/beta-releases.md.
#
# Order of the publishing jobs is deliberate: the GitHub release (deletable) first,
# then PyPI last, because a PyPI upload is the one step that cannot be undone or
# re-run. The TestPyPI rehearsal job is kept but disabled (`if: false`); flip it
# back on and add it to the downstream `needs` lists to reinstate it.
#
# workflow_dispatch builds and validates the same artifacts without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also upload to TestPyPI (currently disabled, see publish-testpypi)"
        type: choice
        options: ["no", "testpypi"]
        default: "no"

permissions:
  contents: read

# Must never equal the group tests.yml computes for the same ref, or the `test`
# job below waits on this run and the run waits on it (see tests.yml).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      beta: ${{ steps.version.outputs.beta }}
      beta-branch: ${{ steps.origin.outputs.beta-branch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Oldest interpreter we claim to support. The wheel is py3-none-any, so
          # this only decides what the smoke test runs against.
          python-version: "3.10"

      - name: Resolve the packaged version
        id: version
        run: |
          python3 -m pip install --quiet packaging
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re
          from packaging.version import Version
          source = pathlib.Path("src/tenstorrent/__init__.py").read_text()
          raw = re.search(r'__version__ = "([^"]+)"', source).group(1)
          version = Version(raw)  # rejects anything PyPI would reject
          # An unnormalised literal (1.0.0-rc1) still builds, but the tag, the wheel
          # filename and `tt --version` would then disagree about the same release.
          if str(version) != raw:
              raise SystemExit(f"__version__ '{raw}' is not normalised; write '{version}' instead")
          print(f"version={raw}")
          print(f"prerelease={str(version.is_prerelease).lower()}")
          # A beta (1.3.0b1) is the one pre-release that is published to PyPI and may
          # be tagged on a beta/<feature> branch. rc, alpha and dev versions are not.
          beta = version.pre is not None and version.pre[0] == "b" and version.dev is None
          print(f"beta={str(beta).lower()}")
          PY

      # Tag creation is restricted, but whoever may create a tag can point it at any
      # commit. Everything on main and on beta/* went through a reviewed PR, so
      # requiring the tagged commit to be on one of them means a release can only ship
      # reviewed code. Only a beta may come from beta/*, so a feature still in beta can
      # never reach a stable or rc release without first being merged into main.
      - name: Check where the tagged commit lives
        id: origin
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          # The checkout is shallow; fetch the branch histories so ancestry can be walked.
          git fetch --quiet --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/beta/*:refs/remotes/origin/beta/*'
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "tag ${GITHUB_REF_NAME} points at a commit on main"
            exit 0
          fi
          if [ "${BETA}" != "true" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            echo "Releases are cut from main only; only a beta (X.Y.ZbN) may be tagged"
            echo "on a beta/<feature> branch. Delete the tag, merge the change through"
            echo "a PR, and tag the resulting commit on main."
            exit 1
          fi
          # Not on main, so on at most the beta branch it was made on (and any branch
          # cut from that one, which is ambiguous and refused).
          mapfile -t branches < <(git for-each-ref --contains "${GITHUB_SHA}" \
            --format='%(refname:strip=3)' 'refs/remotes/origin/beta/')
          if [ "${#branches[@]}" -eq 0 ]; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main or any beta/* branch"
            echo "A beta is cut from a beta/<feature> branch. Delete the tag, merge the"
            echo "change through a PR into that branch, and tag the resulting commit."
            exit 1
          fi
          if [ "${#branches[@]}" -gt 1 ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is on several beta branches: ${branches[*]}"
            echo "Tag a commit that only one beta/<feature> branch contains."
            exit 1
          fi
          echo "beta-branch=${branches[0]}" >> "$GITHUB_OUTPUT"
          echo "tag ${GITHUB_REF_NAME} points at a commit on ${branches[0]}"

      - name: Check the tag against the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.version }}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            echo "Bump __version__ in src/tenstorrent/__init__.py (pyproject reads it"
            echo "via [tool.hatch.version]), commit, delete the tag, and retag."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches the packaged version"

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --quiet build
          python3 -m build

      - name: Check the distribution metadata
        run: |
          python3 -m pip install --quiet twine
          python3 -m twine check --strict dist/*

      - name: Smoke-test the wheel in a clean environment
        env:
          # Never let a build machine spool or send usage telemetry.
          TT_TELEMETRY_DISABLED: "1"
          TT_CONFIG_DIR: /tmp/tt-smoke/config
          TT_DATA_DIR: /tmp/tt-smoke/data
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tt-smoke/venv
          /tmp/tt-smoke/venv/bin/pip install --quiet dist/*.whl
          printed="$(/tmp/tt-smoke/venv/bin/tt --version)"
          expected="tt ${{ steps.version.outputs.version }}"
          if [ "${printed}" != "${expected}" ]; then
            echo "::error::installed CLI printed '${printed}', expected '${expected}'"
            exit 1
          fi
          /tmp/tt-smoke/venv/bin/tt --help > /dev/null
          # The bundled manifest and catalog are data files, not modules, so a
          # packaging slip drops them from the wheel without breaking any import.
          /tmp/tt-smoke/venv/bin/python -c "from tenstorrent.config.paths import get_paths; from tenstorrent.tools.manifest import LocalManifestSource; from tenstorrent.modelhub.catalog import ModelCatalog; from tenstorrent.modelhub.bundles import curated_ids; LocalManifestSource(get_paths()).load(); ModelCatalog(); assert curated_ids(); print('bundled data files OK')"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The full suite, fake-tool matrix and real hardware both. Depending on `build`
  # keeps a version/tag mismatch from occupying the hardware runner for nothing.
  test:
    name: tests
    needs: [build]
    uses: ./.github/workflows/tests.yml

  # Disabled: no TestPyPI trusted publisher is configured for this project. Re-enable
  # by restoring the `if` below and adding this job back to the `needs` of
  # github-release and publish-pypi.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test]
    if: false
    # if: >-
    #   github.repository == 'tenstorrent/tt-cli'
    #   && (startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'testpypi')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tenstorrent
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there is
      # no API token to store or rotate. Configure the publisher at
      # https://test.pypi.org/manage/account/publishing/ (repo tenstorrent/tt-cli,
      # workflow release.yml, environment testpypi) before the first upload.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version can never be re-uploaded, so a re-run of the workflow must not
          # fail on files the rehearsal index already has.
          skip-existing: true
          print-hash: true

  github-release:
    name: Create GitHub release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog builder diffs against the previous tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Diff against the latest *stable* tag this commit contains, never another
      # pre-release: betas from different beta/<feature> branches share one version
      # line, so the "previous tag" could be another feature's beta and the notes
      # would be wrong for both. Also names a beta's release after its branch.
      - name: Pick the changelog base and release name
        id: base
        env:
          BETA_BRANCH: ${{ needs.build.outputs.beta-branch }}
        run: |
          from_tag="$(git tag --merged HEAD --sort=-v:refname 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "${GITHUB_REF_NAME}" | head -n 1 || true)"
          echo "from-tag=${from_tag}" >> "$GITHUB_OUTPUT"
          echo "changelog base: ${from_tag:-<none, builder default>}"
          name="${GITHUB_REF_NAME}"
          if [ -n "${BETA_BRANCH}" ]; then
            name="${name} (beta: ${BETA_BRANCH#beta/})"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build the changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "HYBRID" # merged PRs and direct commits both
          fromTag: ${{ steps.base.outputs.from-tag }}
          toTag: ${{ github.ref_name }}
          configurationJSON: |
            {
              "template": "#{{CHANGELOG}}\n\n## Contributors\n#{{CONTRIBUTORS}}\n\n## Install\n\n```bash\nuv tool install tenstorrent==${{ needs.build.outputs.version }}\n# or\npipx install tenstorrent==${{ needs.build.outputs.version }}\n```\n\nThe installed binary is `tt`.",
              "categories": [
                {
                  "title": "## 🔄 Changes",
                  "labels": []
                }
              ],
              "pr_template": "- #{{TITLE}} (#{{NUMBER}}) by @#{{AUTHOR}}",
              "commit_template": "- #{{TITLE}} (#{{MERGE_SHA}}) by @#{{AUTHOR}}"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.base.outputs.name }}
          body: ${{ steps.changelog.outputs.changelog }}
          # Formats for model catalogs are documented in scripts/build_model_support.py and scripts/build_community_catalog.py.
          files: |
            dist/*
            src/tenstorrent/modelhub/model_support.json
            src/tenstorrent/modelhub/community_catalog.json
          draft: false
          # 0.1.0.dev0, 1.0.0rc1 and friends are flagged so they do not become the
          # repo's "Latest release".
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}

  # Not a prerequisite of PyPI: a failed upload is re-run by hand from
  # publish-compat-overrides.yml.
  publish-compat-overrides:
    name: Publish compatibility matrix overrides
    needs: [build, test]
    if: >-
      github.repository == 'tenstorrent/tt-cli'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build.outputs.prerelease == 'false'
    uses: ./.github/workflows/publish-compat-overrides.yml
    secrets: inherit

  # Stable releases and betas only. Betas are published so testers can install one
  # by exact version; pip, uv and `tt self update` never pick them up otherwise. rc,
  # alpha and dev versions stay off PyPI, since an upload can never be taken back.
  publish-pypi:
    name: Publish to PyPI
    needs: [build, test, github-release]
    if: >-
      github.repository == 'tenstorrent/tt-cli'
      && startsWith(github.ref, 'refs/tags/v')
      && (needs.build.outputs.prerelease == 'false' || needs.build.outputs.beta == 'true')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tenstorrent
    permissions:
      # See the TestPyPI job. Publisher lives at
      # https://pypi.org/manage/account/publishing/ — since `tenstorrent` does not
      # exist on PyPI yet, add it there as a *pending* publisher, which both claims
      # the name and authorises this workflow to create the project.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
