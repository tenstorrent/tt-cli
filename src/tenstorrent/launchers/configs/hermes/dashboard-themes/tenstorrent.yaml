# Tenstorrent dashboard theme for Hermes, installed by `tt launch hermes --web`
name: tenstorrent
label: Tenstorrent
description: White and violet, like Tenstorrent Deep Research
palette:
  background:
    hex: '#FFFFFF'
    alpha: 1
  midground:
    hex: '#5241C2'
    alpha: 1
  foreground:
    hex: '#111827'
    alpha: 0
  warmGlow: rgba(124, 104, 250, 0.0)
  noiseOpacity: 0
typography:
  fontSans: '"Noto Sans", system-ui, sans-serif'
  fontMono: '"Noto Sans Mono", ui-monospace, monospace'
  fontUrl: https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap
  baseSize: 15px
  lineHeight: '1.55'
  letterSpacing: '0'
layout:
  radius: 0.5rem
  density: comfortable
colorOverrides:
  primary: '#7C68FA'
  primaryForeground: '#FFFFFF'
  ring: '#7C68FA'
  accent: '#EFECFF'
  accentForeground: '#33287A'
  border: '#E5E7EB'
  input: '#E5E7EB'
  success: '#29A38D'
  warning: '#D97706'
  destructive: '#D43B1C'
assets:
  logo: data:image/png;base64,
customCSS: "\n/* ---- Tenstorrent Deep Research look ---- */\n:root { --tt-violet:#7C68FA; --tt-violet-deep:#5241C2; --tt-violet-tint:#EFECFF; --tt-text:#111827;\n        --tt-muted:#6B7280; --tt-line:#E5E7EB; }\nbody, #root { font-family: \"Noto Sans\", system-ui, sans-serif; }\n\n/* sidebar: white, hairline border, sentence-case nav like the research UI */\n#app-sidebar { background:#fff !important; border-right:1px solid var(--tt-line) !important; }\n#app-sidebar > div:first-child { border-bottom:1px solid var(--tt-line) !important; }\n#app-sidebar > div:first-child > div > span { font-size:0 !important; display:flex !important; align-items:center; gap:10px; }\n#app-sidebar > div:first-child > div > span br { display:none; }\n#app-sidebar > div:first-child > div > span::before { content:\"\"; width:26px; height:26px; flex:none;\n  background: var(--theme-asset-logo) center / contain no-repeat; }\n#app-sidebar > div:first-child > div > span::after { content:\"Tenstorrent Agent\"; font-size:1.05rem;\
  \ font-weight:700;\n  letter-spacing:0; text-transform:none; color:var(--tt-text); }\n#app-sidebar nav a { text-transform:none !important; letter-spacing:0 !important; font-size:0.9rem !important;\n  color:#374151 !important; margin:1px 10px; padding:8px 12px !important; border-radius:8px; clip-path:none !important; }\n#app-sidebar nav a::first-letter { text-transform:uppercase; }\n#app-sidebar nav a:hover { background:#F9FAFB; color:var(--tt-violet-deep) !important; }\n#app-sidebar nav a[aria-current=\"page\"] { background:var(--tt-violet-tint); color:var(--tt-violet-deep) !important; font-weight:600; }\n#app-sidebar nav a[aria-current=\"page\"]::before, #app-sidebar nav a[aria-current=\"page\"]::after { display:none !important; }\n\n/* page title bar like \"Deep Research\" */\nh1.font-expanded { font-family:\"Noto Sans\", system-ui, sans-serif !important; font-size:1.05rem !important;\n  letter-spacing:0 !important; color:var(--tt-text) !important; font-weight:700 !important; }\nheader,\
  \ main > header { border-color: var(--tt-line) !important; }\n\n/* buttons / outlined controls: thin grey, violet focus */\nbutton:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--tt-violet) !important; }\n\n/* ---- readable text everywhere: neutral greys instead of translucent violet ---- */\n:root {\n  --color-text-primary: #111827 !important;\n  --color-text-secondary: #374151 !important;\n  --color-text-tertiary: #4B5563 !important;\n  --color-text-disabled: #9CA3AF !important;\n  --color-muted-foreground: #4B5563 !important;\n  --color-border: #E5E7EB !important;\n  --color-muted: #F9FAFB !important;\n}\n.text-text-primary { color:#111827 !important; }\n.text-text-secondary { color:#374151 !important; }\n.text-text-tertiary { color:#4B5563 !important; }\n/* violet only where it means something (links, active, accents), at full strength */\n.text-midground { color:#4333A8 !important; }\nbody { color:#111827; }\n\n/* badges: the compressed display\
  \ font is hard to read small; use the UI font */\n.font-compressed { font-family:\"Noto Sans\", system-ui, sans-serif !important; letter-spacing:0.02em !important;\n  font-size:0.72rem !important; font-weight:600; border-radius:6px; }\n/* inline code: light grey chip, dark text (was a solid violet block) */\ncode { background:#F3F4F6 !important; color:#1F2937 !important; padding:1px 5px; border-radius:4px; }\n/* expanded display font in section headings: plain bold UI font */\n.font-expanded { font-family:\"Noto Sans\", system-ui, sans-serif !important; letter-spacing:0 !important; }\n\n/* Hermes' decorative pixel/serif display font: the UI font instead */\n.font-mondwest { font-family:\"Noto Sans\", system-ui, sans-serif !important; letter-spacing:0 !important; font-style:normal !important; }\n"
