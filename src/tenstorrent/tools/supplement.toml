# The golden-version pin plus CLI-only tools tt-sw-manifest doesn't cover.
# The installer-managed stack versions (smi, flash, kmd, sfpi, firmware, ...)
# are NOT recorded here: `tt update` fetches golden.json at the [golden] tag
# and caches it — see manifest.py.
schema_version = 1

[golden]
# The tt-sw-manifest release we pin. golden.json is its distro-agnostic
# component→version map; `tt update` fetches it at this tag, verifies it against
# `sha256` (GitHub's published asset digest), and caches it keyed by the tag.
# `tag` must equal TTIS_GOLDEN_VERSIONS_TAG in the pinned install.sh below —
# that is the release the installer converges the system stack to, so a mismatch
# means tt would display and pin versions the installer won't install.
# `tt update` refuses to run a golden install.sh whose tag differs from `tag`.
# Bump the installer pin and this table together.
tag = "v3.0.0"
sha256 = "90081d2efe5bcb236ea3cec6c28eb0115f4ac37d329194f4d221bfaa5e202fd6"
url_template = "https://github.com/tenstorrent/tt-sw-manifest/releases/download/{tag}/golden.json"

[tools.tt-installer]
kind = "script"
# Supports --versions=<channel|.ttis path>; the older --import-schema flag is gone.
# Flag contract (--mode-non-interactive, --versions, --reboot-option,
# --no-install-inference-server, --no-install-studio, --use-uv, --python-version,
# --update-firmware=on|force) re-verified against the v3.6.1 script on 2026-10-01
# (unchanged; --use-uv/--python-version=3.12/--update-firmware=force are still the
# upstream defaults). tt-cli explicitly passes --update-firmware=on for a normal
# update so current or newer firmware is never reflashed; --force opts back into
# the upstream force behavior.
golden_version = "3.6.1"
# Interpreter the installer's managed venv (~/.tenstorrent-venv) is built with.
# Passed as `--python-version=<this> --use-uv`; install.sh only honors the pin with
# --use-uv, which lets uv provision the interpreter instead of trusting the distro
# python. Only applied when running the golden installer — older releases predate
# the flag and would die on an unrecognized option.
python = "3.12"
url = "https://github.com/tenstorrent/tt-installer/releases/download/v3.6.1/install.sh"
# {version} slot lets `tt update <semver>` fetch a specific install.sh release
# (e.g. to downgrade the system stack). Only the golden version is sha256-pinned;
# user-requested versions are fetched unpinned (with a warning).
url_template = "https://github.com/tenstorrent/tt-installer/releases/download/v{version}/install.sh"
# sha256 of the released v3.6.1 asset (pinned 2026-10-01; matches GitHub's
# published asset digest for the release).
sha256 = "c90c17139f33e796b4141400de0a2da17be39f4a787292c05ccb2a2d13ee3fab"
needs_sudo = true # install.sh sudo's internally

[tools.tt-inference-server]
kind = "git-venv"
# Not yet on PyPI; sourced from git at a pinned ref. Swap to a plain package
# name (kind = "uv-tool") with a one-line change once it ships to PyPI.
# v0.18.0 is the first pin validated on Blackhole P300 hardware (earlier tags,
# e.g. v0.6.0, predate the p300/p300x2 device types entirely).
golden_version = "v0.23.0"
repo = "https://github.com/tenstorrent/tt-inference-server"
entry = "run.py"
python = "3.10"
# run.py's own import closure. The repo has no root requirements.txt — it
# bootstraps heavyweight per-workflow venvs itself from inside run.py.
deps = ["pyyaml", "packaging"]
# Only users who serve need it, and the checkout is ~180 MB — `tt update` keeps it
# current once it is present but will not fetch it for someone who never serves
# (`tt serve` installs it on first use; `tt update --include-lazy` forces it).
lazy = true

[tools.tt-model]
# tt-model-manager: publishes and pulls self-contained tt-metal model bundles over
# the HF Hub and serves them — a parallel serving path to tt-inference-server, not
# a replacement. Keyed `tt-model` because that is the distribution, the command it
# installs, and what `TT_TOOL_BIN_TT_MODEL` overrides; the repo it is pinned from
# is tt-model-manager (see `repo` below).
kind = "uv-tool"
package = "tt-model"
# Not on PyPI yet, so uv installs it from a git ref (see UvToolInstaller). Swap to
# a plain pinned version once it publishes: drop `repo`, set golden_version.
repo = "https://github.com/tenstorrent/tt-model-manager"
# Upstream publishes no tags yet, so the pin is a commit. Bumping it reinstalls
# via registry.ensure() (recorded state != golden pin).
golden_version = "7994e0a13222eb0d90934bf087b8ba761525166e"
python = "3.10"
health = ["--version"]

[tools.tt-studio]
# TT-Studio: the third `tt serve` path, for the models only its catalog carries
# (bundled copy: modelhub/studio_models.json — re-copy it from
# app/backend/shared_config/models_from_inference_server.json on a bump). tt
# delegates the whole lifecycle to the checkout's run.py: `run <model>` deploys,
# `--stop-model <model>` stops it, `--stop` takes the stack down (after a stop or a
# failed deploy).
# Catalog copy taken from dev@f96ec8c7 on 2026-09-22.
kind = "git-venv"
golden_version = "v2.11.0"
repo = "https://github.com/tenstorrent/tt-studio"
entry = "run.py"
python = "3.12"
# run.py bootstraps its own deps into .tt_studio_run_venv and re-execs itself, so
# the managed venv only has to provide the interpreter.
deps = []
# Only users who serve a studio-only model need the ~200 MB checkout.
lazy = true
