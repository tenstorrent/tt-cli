# Community bundles `tt model list --community` shows: those that passed the
# QuietBox 2 validation sweep of 2026-09-25, or were validated separately.
#
# INPUT, never generated. scripts/build_community_catalog.py validates this file
# and writes community_catalog.json, which tt reads and each release publishes;
# rebuild and commit both together (CI fails on a stale output).
#
# TEMPORARY: hand-curated while the whitelisting process is built. Once it ships,
# the build reads the Hub instead and this file is deleted; the JSON stays.
#
# Bundles not listed here can still be served; `tt serve` warns that they are
# not in the catalog.
#
# repo          Hub repo id, namespace/name.
# kind          container | self-contained | thin. Omit when unknown.
# engine        vllm-plugin | vllm-fork | tt-dit-server. Omit when unknown.
# hardware      Boards/meshes it was validated on ("p150", "p300x2"); arch is
#               derived from these.
# validation    sweep (the QuietBox 2 sweep) | separate (validated on its own).
# validated_on  YYYY-MM-DD, when known.

schema_version = 1

