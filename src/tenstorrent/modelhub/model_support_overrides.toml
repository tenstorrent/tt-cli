# ===========================================================================
# Device fallbacks
# ===========================================================================
# The release spec declares every device explicitly and never implies that a
# model specced for one runs on another. These rules add the substitutions that
# do hold: the build fills the missing device from `serve_as`, and `tt serve`
# sends `--device <serve_as>` — sending the board's own name would 404 on the
# spec lookup. A rule never shadows a device whose own spec works, and never
# borrows from one that is marked broken.
#
# `support_source` says which kind of substitution it is, because they are not
# equally safe: "mesh-equivalent" runs the same topology under another name,
# while "single-chip" runs the model on one chip of a larger board and leaves
# the rest idle.

[[device_fallback]]
device = "p150x4"
serve_as = "p300x2"
engines = ["vLLM"]
support_source = "mesh-equivalent"
verified_on = "2026-08-14"
source = "tt-studio"
details = """
Several chat models publish a p300x2 spec and no p150x4 one. The p300x2 specs are the maintained pair of the two, so this is also the better spec to run."""

[[device_fallback]]
device = "p300x2"
serve_as = "p150x4"
engines = ["vLLM"]
support_source = "mesh-equivalent"
verified_on = "2026-08-14"
source = "tt-studio"
details = "The reverse direction, for a model specced only for p150x4."

[[device_fallback]]
device = "p150x4"
serve_as = "p150"
engines = ["media"]
support_source = "single-chip"
verified_on = "2026-09-03"
source = "tt-cli"
details = """
Media models specced for a single Blackhole chip run on one chip of a p150x4 \
board: verified for distil-large-v3, speecht5_tts and whisper-large-v3, which \
already reach p300x2 through their own specs.

Deliberately media only. Forge was tried and does not work — Falcon3-7B-Instruct \
and yolox_nano fail on p150x4 despite their p150 specs. And vLLM models declare \
their own mesh specs, so narrowing one to a single chip would waste three \
quarters of the board rather than fix anything."""

# ===========================================================================
# Serve-time overrides
# ===========================================================================
# Flags `tt serve` must pass because the spec's own value is wrong or missing.
# Only what run.py can express:
#   docker_image       -> --override-docker-image
#   override_tt_config -> --override-tt-config  (vLLM only, see below)
#
# NOT here, deliberately:
#   * Llama-3.3-70B-Instruct / p150x4 trace region. tt-studio carries one, but it
#     never fires: the p150x4 spec is marked broken above, so the model resolves
#     through mesh equivalence to p300x2, whose spec already has the right value.
#   * FLUX trace regions on p150x4. tt-studio forces 51 MB there, but the image
#     override below is what makes those two work and the trace override is not
#     needed alongside it (verified on hardware). Just as well: media containers
#     read that setting from container env (pydantic BaseSettings), not from the
#     vLLM additional_config --override-tt-config feeds, and run.py has no flag
#     to set container env — tt-studio patches its own service to bridge the
#     two, and tt has no equivalent seam.

[[serve_override]]
model = "Wan2.2-T2V-A14B-Diffusers"
docker_image = "ghcr.io/tenstorrent/tt-media-inference-server:0.17.0-8c48a10"
verified_on = "2026-08-14"
source = "tt-studio"
details = """
0.17.0 carries the MODEL_WEIGHTS_DIR fix (tt-inference-server#4107), so the \
container reads the mounted host HF cache instead of re-downloading ~118 GB. \
Applies on every board."""

[[serve_override]]
model = "FLUX.1-dev"
device = "p150x4"
docker_image = "ghcr.io/tenstorrent/tt-media-inference-server:0.17.0-8c48a10"
verified_on = "2026-08-14"
source = "tt-studio"
details = "The p150x4 spec resolves to 0.10.0-555f240, whose API tt cannot drive."

[[serve_override]]
model = "FLUX.1-schnell"
device = "p150x4"
docker_image = "ghcr.io/tenstorrent/tt-media-inference-server:0.18.0-c49bb76"
verified_on = "2026-08-14"
source = "tt-studio"
details = "The p150x4 spec resolves to 0.10.0-555f240, whose API tt cannot drive."
