# Models the pinned tt-inference-server release advertises that do not actually
# work on Tenstorrent hardware, recorded per board.
#
# INPUT, never generated. scripts/build_model_support.py reads this file and
# validates it, but never writes it: model_support.json is the output, and CI
# regenerates it, so a fix belongs here and nowhere else.
#
# Deleting an entry genuinely un-hides the model on the next build. That is the
# point — a mark that outlives its bug is as harmful as a missing one, so every
# entry has to say what breaks and when someone last saw it break.
#
# `device` is a spec device_type, lowercased ("p300x2", "p150x4"). Omit it for a
# defect that is not board-specific. A device that the model's spec does not
# claim is an error, not a silent no-op: a "p150x4" / "P150X4" casing slip once
# left a model on offer on a board it was meant to be pulled from.
#
# reason:
#   broken      — does not deploy, or deploys and does not run. A bug.
#   unsupported — runs on the server, but tt has no path to drive it.
#
# Only `broken` marks are carried over from tt-studio. Its "no UI for this
# modality" marks (embeddings) describe a Studio constraint the CLI does not
# share, so those models stay listed here.

schema_version = 1

