[project]
name = "tenstorrent"
# Single-sourced from src/tenstorrent/__init__.py (see [tool.hatch.version]), so the
# release workflow can check the git tag against one number that is also `tt --version`.
dynamic = ["version"]
description = "Tenstorrent CLI (tt): the single entry point to the Tenstorrent software stack"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE_understanding.txt", "NOTICE"]
authors = [{ name = "June Knauth", email = "jknauth@tenstorrent.com" }]
maintainers = [{ name = "Tenstorrent", email = "jknauth@tenstorrent.com" }]
keywords = ["tenstorrent", "cli", "accelerator", "ai", "tt-smi", "tt-flash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "typer>=0.27.2",
    "rich>=13",
    "tomlkit>=0.12",
    "platformdirs>=4",
    "uv>=0.5",
    "huggingface_hub>=0.23",
    "httpx>=0.27",
    # Version/specifier parsing for the self-update check (already transitive via
    # huggingface_hub; declared because we import it).
    "packaging>=23",
    # Usage telemetry (OTLP/HTTP; gRPC exporter deliberately avoided to skip grpcio).
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # Spool format for persist-then-drain delivery: the spec'd OTLP File Exporter
    # (JSON Lines), so the on-disk format is standard rather than invented.
    "opentelemetry-exporter-otlp-json-file>=0.65b0",
]

[project.urls]
Homepage = "https://github.com/tenstorrent/tt-cli"
Repository = "https://github.com/tenstorrent/tt-cli"
Issues = "https://github.com/tenstorrent/tt-cli/issues"
Changelog = "https://github.com/tenstorrent/tt-cli/releases"

[project.scripts]
tt = "tenstorrent.cli:main"

[build-system]
# PEP 639 (`license = "Apache-2.0"` + `license-files`) needs hatchling >= 1.27.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tenstorrent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tenstorrent"]

[tool.hatch.build.targets.sdist]
# An sdist should be able to rebuild the wheel and run the suite; the working
# notes, design docs, and CI config are repo furniture, not part of the package.
exclude = [".github", ".gitignore"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: tests that require real network access (deselected by default in demo runs)",
    "fakes_only: asserts fake-tool internals (recorded argv, canned scenarios, exact fixture values); skipped under --hardware",
    "hardware: real-hardware smoke test; skipped unless --hardware is given",
    "destructive: mutates the machine; under --hardware skipped unless --run-destructive is also given",
]
